openapi: 3.1.0
info:
  title: Inventory REST API
  version: 1.0.0
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CycleCountPlan:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        abcClassification:
          type: string
          example: A
        frequencyDays:
          type: integer
          example: 30
        zone:
          type: string
          nullable: true
          example: ZONE-1
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - tenantId
      - name
      - abcClassification
      - frequencyDays
      - isActive
    CycleCountAudit:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        abcClass:
          type: string
          example: A
        zone:
          type: string
          nullable: true
          example: ZONE-1
        isBlindCount:
          type: boolean
        assignedTo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - tenantId
      - name
      - status
      - isBlindCount
      - createdAt
    ABCClassificationResult:
      type: object
      properties:
        class:
          type: string
          enum:
          - A
          - B
          - C
        frequencyDays:
          type: integer
          example: 30
      required:
      - class
      - frequencyDays
    ApprovalWorkflow:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        triggerEvent:
          type: string
        config:
          oneOf:
          - type: string
          - type: object
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - tenantId
      - name
      - triggerEvent
      - config
    ApprovalDecision:
      type: object
      properties:
        id:
          type: string
        requestId:
          type: string
        stepIndex:
          type: integer
        deciderId:
          type: string
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        notes:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
      required:
      - id
      - requestId
      - stepIndex
      - deciderId
      - decision
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        workflowId:
          type: string
        referenceType:
          type: string
        referenceId:
          type: string
        requesterId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - ESCALATED
        currentStep:
          type: integer
        payload:
          type: string
        workflow:
          $ref: '#/components/schemas/ApprovalWorkflow'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalDecision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - tenantId
      - workflowId
      - referenceType
      - referenceId
      - requesterId
      - status
      - currentStep
    Notification:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          example: info
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - tenantId
      - title
      - message
      - type
      - isRead
      - createdAt
    NotificationPreference:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        tenantId:
          type: string
        channel:
          type: string
          example: EMAIL
        eventType:
          type: string
          example: LOW_STOCK
        isEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - userId
      - tenantId
      - channel
      - eventType
      - isEnabled
      - createdAt
    Item:
      type: object
      properties:
        variantId:
          type: string
        quantity:
          type: number
        unitCostCents:
          type: number
      required:
      - variantId
      - quantity
      - unitCostCents
    StockOnboarding:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
        asOfDate:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Barcode:
      type: object
      properties:
        value:
          type: string
        symbology:
          type: string
    BarcodeAssignment:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        barcode:
          $ref: '#/components/schemas/Barcode'
        source:
          type: string
        isPrimary:
          type: boolean
        assignedAt:
          type: string
    ProductVariant:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        trackingMode:
          type: string
          enum:
          - quantity
          - serial
          - lot
        attributes:
          type: array
          items:
            type: object
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/BarcodeAssignment'
        weightGrams:
          type: number
        volumeCubicMeters:
          type: number
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
    JournalLine:
      type: object
      properties:
        accountCode:
          type: string
        amountCents:
          type: number
        type:
          type: string
          enum:
          - debit
          - credit
        memo:
          type: string
    JournalEntry:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        date:
          type: string
        description:
          type: string
        method:
          type: string
          enum:
          - cash
          - accrual
        referenceId:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
    StatusTransition:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        reason:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
        referenceId:
          type: string
    SerializedItem:
      type: object
      properties:
        id:
          type: string
        variantId:
          type: string
        serialNumber:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        status:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusTransition'
    ShopifyConnection:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        platform:
          type: string
        storeDomain:
          type: string
        isActive:
          type: boolean
    InventoryItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        quantity:
          type: number
        version:
          type: number
    ForecastingReportItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        currentStock:
          type: number
        salesVelocity7d:
          type: number
        salesVelocity30d:
          type: number
        salesVelocity90d:
          type: number
        forecastedDemand:
          type: number
        suggestedROP:
          type: number
        safetyStock:
          type: number
    FulfillmentAllocation:
      type: object
      properties:
        locationId:
          type: string
        quantity:
          type: number
    FulfillmentPlan:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentAllocation'
        totalCost:
          type: number
        totalDistance:
          type: number
        splitCount:
          type: number
    ReorderPolicy:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        reorderPoint:
          type: number
        reorderQuantity:
          type: number
        safetyStock:
          type: number
        dynamicRopEnabled:
          type: boolean
      required:
      - id
      - sku
      - locationId
      - reorderPoint
      - reorderQuantity
      - safetyStock
      - dynamicRopEnabled
    ReorderPolicyEvaluationResult:
      type: object
      properties:
        sku:
          type: string
        locationId:
          type: string
        reorderPoint:
          type: number
        triggered:
          type: boolean
        reason:
          type: string
      required:
      - sku
      - locationId
      - reorderPoint
      - triggered
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
    WebhookDeliveryLog:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        eventName:
          type: string
        status:
          type: string
        statusCode:
          type: number
        occurredOn:
          type: string
    WarehouseLocation:
      type: object
      properties:
        id:
          type: string
        warehouseId:
          type: string
        zone:
          type: string
        maxWeightGrams:
          type: number
        maxVolumeCubicMeters:
          type: number
    PutawaySuggestion:
      type: object
      properties:
        locationId:
          type: string
        sku:
          type: string
        suggestedQuantity:
          type: number
    PurchaseOrderItem:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: number
        unitCostCents:
          type: number
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        supplier:
          type: string
        status:
          type: string
          enum:
          - draft
          - approved
          - sent
          - received
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
        createdAt:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
    AuditDiscrepancy:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        expectedQuantity:
          type: number
        actualQuantity:
          type: number
        discrepancyCount:
          type: number
        status:
          type: string
        detectedAt:
          type: string
        resolvedAt:
          type: string
    OutboxStats:
      type: object
      properties:
        pendingCount:
          type: number
        publishedCount:
          type: number
        failedCount:
          type: number
    OutboxEvent:
      type: object
      properties:
        id:
          type: string
        eventType:
          type: string
        payload:
          type: string
        error:
          type: string
        status:
          type: string
        occurredAt:
          type: string
    TenantAccountingConfig:
      type: object
      properties:
        tenantId:
          type: string
        accountingMethod:
          type: string
        costingMethod:
          type: string
        currencyCode:
          type: string
        fiscalYearStart:
          type: string
    QuarantinedItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        quantity:
          type: number
        reason:
          type: string
        status:
          type: string
        createdAt:
          type: string
    ValuationItem:
      type: object
      properties:
        variantId:
          type: string
        sku:
          type: string
        name:
          type: string
        costingMethod:
          type: string
        totalQuantity:
          type: number
        totalValueCents:
          type: number
        unitCostCents:
          type: number
    RfidTag:
      type: object
      properties:
        epc:
          type: string
        sku:
          type: string
        serialNumber:
          type: string
        status:
          type: string
        lastSeenAt:
          type: string
        lastLocation:
          type: string
    RfidScanUpdate:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        totalCount:
          type: number
        matchedCount:
          type: number
        unmatchedCount:
          type: number
        unmatchedEpcs:
          type: array
          items:
            type: string
paths:
  /api/auth/login:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/approvals/workflows:
    get:
      summary: List approval workflows
      description: Retrieve all configured approval workflows for the authenticated tenant.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of approval workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalWorkflow'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      summary: Create approval workflow
      description: Define a new multi-tier approval workflow rule.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - triggerEvent
              - config
              properties:
                name:
                  type: string
                  example: High Value PO Approval
                triggerEvent:
                  type: string
                  example: PO_CREATED
                config:
                  oneOf:
                  - type: object
                  - type: string
                  example:
                    thresholds:
                    - field: totalAmount
                      operator: '>'
                      value: 10000
                    steps:
                    - approverRoles:
                      - finance_manager
                      requiredCount: 1
                      timeoutHours: 48
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Approval workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/approvals/workflows/{id}:
    put:
      summary: Update approval workflow configuration
      description: Update the thresholds and steps configuration of an existing approval workflow.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique workflow identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config
              properties:
                config:
                  oneOf:
                  - type: object
                  - type: string
                  example:
                    thresholds:
                    - field: totalAmount
                      operator: '>='
                      value: 15000
                    steps:
                    - approverRoles:
                      - finance_director
                      requiredCount: 1
                      timeoutHours: 72
      responses:
        '200':
          description: Approval workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/approvals/workflows/{id}/toggle:
    post:
      summary: Toggle approval workflow status
      description: Enable or disable an existing approval workflow.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique workflow identifier
      responses:
        '200':
          description: Approval workflow status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/approvals/pending:
    get:
      summary: List pending approval requests
      description: Retrieve pending approval requests awaiting review for the authenticated tenant.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of pending approval requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /api/approvals/{id}:
    get:
      summary: Get approval request by ID
      description: Retrieve an approval request record and its associated decision history.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique approval request identifier
      responses:
        '200':
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/approvals/{id}/decide:
    post:
      summary: Submit approval decision
      description: Record an APPROVE or REJECT decision on a pending approval request.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique approval request identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVE
                  - REJECT
                  example: APPROVE
                notes:
                  type: string
                  example: Budget verified and approved.
      responses:
        '200':
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecision'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/roles/permissions:
    get:
      summary: List system permissions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/roles:
    get:
      summary: List roles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Create custom role
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
  /api/roles/{roleId}/permissions:
    put:
      summary: Update role permissions
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
  /api/roles/{roleId}:
    delete:
      summary: Delete custom role
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/shopify:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory/receive:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory/dispatch:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory/allocate:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory/release-allocation:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory/fulfill-allocation:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/inventory:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/users:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/barcodes/assign:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/barcodes/generate:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/barcodes/scan:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/serials/register:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/serials/trace:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/kits/create:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/kits/assemble:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/kits/disassemble:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/kits/dispatch:
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/accounting/ledger:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/accounting/valuation:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/accounting/tenant-config:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/onboarding:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/purchase-orders:
    post:
      summary: Create purchase order
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/purchase-orders/{id}:
    get:
      summary: Get purchase order
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/purchase-orders/{id}/approve:
    post:
      summary: Approve purchase order
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/purchase-orders/{id}/send:
    post:
      summary: Send purchase order
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
